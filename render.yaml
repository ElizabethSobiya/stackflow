# Render Blueprint — deploys the API and the UI. The database lives on Supabase.
#
#   1. Create the Supabase project first and copy its **session pooler** connection string
#      (see docs/DEPLOYMENT.md — the pooler on port 5432, not the direct connection).
#   2. Render → New → Blueprint → pick this repo.
#   3. Fill in the three values marked `sync: false` when prompted.
#
# Free-tier note: the API sleeps after inactivity, so the first request after a pause takes ~30s.
services:
  - type: web
    name: stackflow-api
    runtime: docker
    plan: free
    # Keep this near the Supabase project. The database is in ap-northeast-1 (Tokyo), and
    # Singapore is the closest free Render region — Frankfurt adds ~230ms to every query.
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render waits for this before routing traffic, and restarts the instance if it stops passing.
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Supabase session-pooler URL, e.g.
      # postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # Translated to JDBC on startup by DatabaseUrlEnvironmentPostProcessor.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong value once and keeps it — never commit a real secret.
      - key: JWT_SECRET
        generateValue: true
      # The deployed frontend origin, e.g. https://stackflow-web.onrender.com — no trailing slash.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Supabase's free pooler allows a modest number of client connections; stay well under it.
      - key: DB_POOL_SIZE
        value: "5"

  - type: web
    name: stackflow-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist/inventory-web/browser
    envVars:
      # The deployed API, including /api — e.g. https://stackflow-api.onrender.com/api
      - key: API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-store
