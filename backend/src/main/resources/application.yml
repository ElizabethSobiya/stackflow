spring:
  application:
    name: inventory-api
  profiles:
    default: dev
  datasource:
    # DB_URL is also derived from a platform-injected DATABASE_URL — see
    # DatabaseUrlEnvironmentPostProcessor.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stackflow}
    username: ${DB_USERNAME:stackflow}
    password: ${DB_PASSWORD:stackflow}
    hikari:
      pool-name: stackflow-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # PORT is what Render, Railway, Heroku and Fly inject; SERVER_PORT stays available locally.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

stackflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      issuer: stackflow-inventory
      # Dev-only default. Override with JWT_SECRET (>= 32 bytes) in every real environment.
      secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  stock:
    default-low-stock-threshold: ${STOCK_DEFAULT_THRESHOLD:10}
    optimistic-lock-retries: ${STOCK_LOCK_RETRIES:5}
  seed:
    enabled: false

logging:
  level:
    com.stackflow.inventory: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
