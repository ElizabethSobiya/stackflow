spring:
  datasource:
    url: jdbc:h2:mem:stackflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

stackflow:
  security:
    jwt:
      issuer: stackflow-test
      secret: test-secret-key-that-is-long-enough-for-hs256-signing
      access-token-ttl: PT15M
      refresh-token-ttl: P1D
  seed:
    enabled: false
